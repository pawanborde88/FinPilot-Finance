databases:
  - name: finpilot-db
    databaseName: finpilot
    user: finpilot_user
    plan: free

services:
  - type: web
    name: finpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
